name: Deploy site/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/prepare_public_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site without methodology
        run: python tools/prepare_public_site.py --source site --output _public_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site
      - name: Wait for Pages artifact availability
        run: python tools/wait_pages_artifact.py
      - id: deployment
        uses: actions/deploy-pages@v4
